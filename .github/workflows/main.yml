name: Build ViaBedrockUtility 26.3

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Locate source ZIP
        shell: bash
        run: |
          set -euxo pipefail
          ZIP="$(find . -maxdepth 1 -type f -name '*.zip' -print -quit)"
          test -n "$ZIP"
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Extract source
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf build-src
          mkdir build-src
          unzip -q "$ZIP" -d build-src

          GRADLEW="$(find build-src -type f -name gradlew -print -quit)"
          test -n "$GRADLEW"

          PROJECT_DIR="$(dirname "$GRADLEW")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project: $PROJECT_DIR"

      - name: Setup Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Build
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euxo pipefail
          chmod +x ./gradlew
          java -version
          ./gradlew --version
          ./gradlew --no-daemon --stacktrace clean build

      - name: Show JAR
        if: always()
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          find build/libs -maxdepth 1 -type f -print 2>/dev/null || true

      - name: Upload JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: viabedrockutility-26.3-jar
          path: ${{ env.PROJECT_DIR }}/build/libs/*.jar
          if-no-files-found: error

      - name: Upload build reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            ${{ env.PROJECT_DIR }}/build/reports/**
            ${{ env.PROJECT_DIR }}/build/test-results/**
          if-no-files-found: ignore
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: viabedrockutility-26.3-jar
          path: ${{ env.PROJECT_DIR }}/build/libs/*.jar
          if-no-files-found: error
